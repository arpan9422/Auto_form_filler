name: Feature Request
description: Suggest a new feature or improvement for FormPilot
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please provide as much detail as possible.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Which part of FormPilot does this feature relate to?
      options:
        - Chrome Extension
        - Backend / API
        - AI Agent / LangGraph
        - RAG System
        - Dashboard Frontend
        - Chat Agent
        - Analytics
        - DevOps / Infrastructure
        - New Component / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the motivation?
      placeholder: I find it frustrating when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you considered?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature here.
