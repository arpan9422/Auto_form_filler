name: Bug Report
description: Report a bug or unexpected behavior in FormPilot
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Pre-flight checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have reproduced this on the latest `main` branch
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of FormPilot is affected?
      options:
        - Chrome Extension (popup/floating button)
        - Content Script (form detection/filling)
        - Backend API
        - LangGraph Autofill Agent
        - RAG / AI Memory
        - Dashboard Frontend
        - Chat Agent
        - Analytics
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or screenshots if available.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please complete the following information.
      value: |
        - OS: [e.g. Windows 11, macOS 14, Ubuntu 22.04]
        - Node.js version: [e.g. 20.11.0]
        - Browser: [e.g. Chrome 125]
        - Extension version: [e.g. 0.1.0]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant backend logs, browser console errors, or network request details.
      render: shell
